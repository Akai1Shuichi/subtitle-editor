name: Build & Release App (Windows & macOS)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SubtitleVideoEditor-Windows.zip
            asset_name: SubtitleVideoEditor-Windows
          - os: macos-latest
            artifact_name: SubtitleVideoEditor-macOS.zip
            asset_name: SubtitleVideoEditor-macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          which ffprobe || brew install ffmpeg

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest

      - name: Build App with PyInstaller
        run: |
          pyinstaller --noconfirm subtitle_editor.spec

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -r ../${{ matrix.artifact_name }} .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_name }}

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}